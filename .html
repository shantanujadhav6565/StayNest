<% layout("layouts/boilerplate") -%>

<div class="row mt-4">
    <div class="col-lg-8 offset-lg-2">

        <h3 class="mb-4">Create New Listing</h3>

        <form 
            action="/listings" 
            method="POST" 
            enctype="multipart/form-data"
            class="needs-validation"
            novalidate
        >

            <!-- Title -->
            <div class="mb-3">
                <label for="title" class="form-label">
                    Title
                </label>

                <input
                    type="text"
                    name="listing[title]"
                    class="form-control"
                    id="title"
                    placeholder="Enter title"
                    required
                >

                <div class="invalid-feedback">
                    Please enter a title.
                </div>
            </div>


            <!-- Description -->
            <div class="mb-3">
                <label for="description" class="form-label">
                    Description
                </label>

                <textarea
                    name="listing[description]"
                    class="form-control"
                    id="description"
                    rows="5"
                    placeholder="Enter description"
                    required
                ></textarea>

                <div class="invalid-feedback">
                    Please enter description.
                </div>
            </div>


            <!-- Image -->
            <div class="mb-3">
                <label for="image" class="form-label">
                    Upload Image
                </label>

                <input
                    type="file"
                    name="listing[image]"
                    class="form-control"
                    id="image"
                >
            </div>


            <div class="row">

                <!-- Price -->
                <div class="col-md-4 mb-3">
                    <label for="price" class="form-label">
                        Price
                    </label>

                    <input
                        type="number"
                        name="listing[price]"
                        class="form-control"
                        id="price"
                        placeholder="1200"
                        required
                    >

                    <div class="invalid-feedback">
                        Enter valid price.
                    </div>
                </div>


                <!-- Country -->
                <div class="col-md-8 mb-3">
                    <label for="country" class="form-label">
                        Country
                    </label>

                    <input
                        type="text"
                        name="listing[country]"
                        class="form-control"
                        id="country"
                        placeholder="India"
                        required
                    >

                    <div class="invalid-feedback">
                        Enter country.
                    </div>
                </div>

            </div>


            <!-- Location -->
            <div class="mb-3">

                <label for="location" class="form-label">
                    Location
                </label>

                <input
                    type="text"
                    name="listing[location]"
                    class="form-control"
                    id="location"
                    placeholder="Pune, Maharashtra"
                    required
                >

                <div class="invalid-feedback">
                    Enter location.
                </div>

            </div>


            <!-- Submit -->
            <button class="btn btn-dark add-btn">
                Add Listing
            </button>

        </form>

    </div>
</div>


<script src="/js/validation.js"></script>
